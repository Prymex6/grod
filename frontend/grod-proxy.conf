# Settings every proxied location needs. Included, not repeated.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Git and the registry stream; buffering them would hold whole packfiles
# in memory and break the progress a client expects to see.
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 1h;
