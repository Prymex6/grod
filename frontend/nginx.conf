# Uploads are not limited and not buffered anywhere below: pushing a
# repository or a container image sends a lot in one request.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;

    # The console and the API share an origin, so the session cookie needs no
    # cross-origin handling at all.
    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/grod-proxy.conf;

        # The terminal of a workspace talks over a WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # OpenID Connect discovery has to sit at the root of the domain.
    location /.well-known/ {
        proxy_pass http://api:8000;
        include /etc/nginx/grod-proxy.conf;
    }

    # Published sites and routed traffic.
    location /-/ {
        proxy_pass http://api:8000;
        include /etc/nginx/grod-proxy.conf;
    }

    # The container registry answers the Docker HTTP API, which is fixed at /v2.
    location /v2/ {
        proxy_pass http://api:8000;
        include /etc/nginx/grod-proxy.conf;
    }

    # Git over HTTP: /<owner>/<project>.git/... Checked before the fallback
    # below, or a clone would be served the console instead.
    location ~ \.git(/|$) {
        proxy_pass http://api:8000;
        include /etc/nginx/grod-proxy.conf;
    }

    # The console routes on the client, so unknown paths get the app, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
