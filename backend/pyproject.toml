[project]
name = "grod"
version = "0.1.0"
description = "Grod platform API"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "asyncssh>=2.24.0",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "pydantic-settings",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn[standard]",
    "webauthn>=3.0.0",
]

[project.scripts]
grod-ssh = "grod.repositories.ssh_server:main"
grod-runner = "grod.ci.runner_cli:main"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grod"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "N", "PT", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test, and its fixtures carry sample passwords.
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["INP001"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# asyncssh has no type hints of its own; the wrapper module stays typed.
module = ["asyncssh.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grod.repositories.ssh_server"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The database engine lives for the whole session, so every test shares one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
